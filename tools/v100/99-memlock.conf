# Strata's PLE table (26.8 GiB) is locked in RAM with --ple-io ram; the default
# RLIMIT_MEMLOCK (15.7 GiB here) cannot hold it, and the engine reports ~6-10%
# slower decode without the lock.  Upstream's own guidance for a systemd service is
# LimitMEMLOCK=infinity; this does the same for the login sessions the production
# scripts are started from.
chenjx  -  memlock  unlimited
